<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170420">
<title>Нить</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%,#4a1d6b,#170420 70%);color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif}
  .logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#ec4899,#a855f7);font-size:44px;box-shadow:0 12px 34px rgba(168,85,247,.45)}
  h1{margin:6px 0 0;font-size:24px}
  p{margin:0;max-width:300px;color:#c9b8d8;line-height:1.45}
  button{margin-top:10px;padding:14px 28px;border:0;border-radius:16px;background:linear-gradient(135deg,#ec4899,#a855f7);color:#fff;font-size:16px;font-weight:700}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="logo">🧵</div>
  <h1>Нет связи</h1>
  <p>Не получается открыть «Нить». Проверьте интернет (или включите VPN) и попробуйте снова.</p>
  <button id="r">Повторить</button>
<script>
  // возвращаемся на главный адрес приложения
  document.getElementById('r').onclick=function(){location.href='https://solofse.github.io/nit/'};
  // как только появится интернет — пробуем сами
  window.addEventListener('online',function(){location.href='https://solofse.github.io/nit/'});
</script>
</body>
</html>
